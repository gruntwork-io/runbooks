repos:
  - repo: local
    hooks:
      - id: docs-spellcheck
        name: Spellcheck docs
        # Same cspell version and globs as docs/package.json's "spellcheck"
        # script, without needing a `bun install` in docs/ first.
        entry: bash -c 'cd docs && bunx --bun cspell@10.3.4 --no-progress "src/content/**/*.{md,mdx}"'
        language: system
        files: ^docs/src/content/.*\.(md|mdx)$
        pass_filenames: false
      - id: oxlint
        name: Lint (oxlint)
        entry: bun run lint
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false
      - id: oxfmt
        name: Format check (oxfmt)
        entry: bun run fmt:check
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|css|html)$
        pass_filenames: false
