version: 1
settings:
  use_temp_working_dir: true
  timeout: 1m
tests:
  - name: misconfigured
    steps:
      - block: no_type
        expect: config_error
        error_contains: "<Admonition> needs the `type` prop."
      - block: unknown_type
        expect: config_error
        error_contains: 'the `type` prop of <Admonition>: Expected "note" | "info" | "warning" | "danger"'
      - block: no_storage_key
        expect: config_error
        error_contains: "it needs `storageKey`, the name the hide is kept under"
      - block: no_hide
        expect: config_error
        error_contains: "it names a hide, so it does nothing without allowPermanentHide={true}"
      - block: fine
        expect: success
