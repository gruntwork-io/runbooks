version: 1
settings:
  use_temp_working_dir: true
  timeout: 1m
tests:
  - name: end-to-end
    inputs:
      config.Name: web
      config.Region: eu-west-1
    steps:
      - block: config
        expect: success
      - block: deploy
        expect: success
        assertions:
          - type: output_equals
            block: deploy
            output: seen
            value: web/eu-west-1/2
      - block: greet
        expect: success
        assertions:
          - type: output_equals
            block: greet
            output: said
            value: hello world
