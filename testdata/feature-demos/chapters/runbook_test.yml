version: 1

settings:
  use_temp_working_dir: true
  timeout: 1m
  parallelizable: true

tests:
  - name: happy-path
    description: |
      Every block runs in document order across the chapters: the Deploy
      chapter's command reads the output the Set up chapter's command wrote,
      as chapters don't scope block ids, inputs or outputs.
    inputs:
      app.AppName: "chapters-demo"
    steps:
      - block: app
        expect: success
      - block: prepare
        expect: success
      - block: deploy
        expect: success
      - block: verify
        expect: success
      - block: finish
        expect: success
    assertions:
      - type: output_equals
        block: deploy
        output: source
        value: "/tmp/chapters-demo"
