version: 1

settings:
  use_temp_working_dir: true
  timeout: "5m"

tests:
  - name: skip-without-credentials
    description: Auth block skips when no credentials; dependent clone block also skips
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      RUNBOOKS_GITHUB_TOKEN: ""
    steps:
      - block: gh-auth
        expect: skip
      - block: clone-repo
        expect: skip
      # create-pr isn't listed: the test runner doesn't parse PR blocks yet, and
      # a step naming a block it can't find fails the test.
