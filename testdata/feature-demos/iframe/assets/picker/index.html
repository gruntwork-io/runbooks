<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Region picker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <p>Deploying <strong id="environment">…</strong> to:</p>
    <div class="regions">
      <button type="button" data-region="us-east-1">us-east-1</button>
      <button type="button" data-region="us-west-2">us-west-2</button>
      <button type="button" data-region="eu-west-1">eu-west-1</button>
    </div>
    <p id="status">Pick a region.</p>
    <script src="picker.js"></script>
  </body>
</html>
