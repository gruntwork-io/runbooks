version: 1

settings:
  use_temp_working_dir: true
  timeout: 1m

tests:
  - name: session-env-and-working-dir
    description: |
      Variables written to RUNBOOK_ENV, from bash or Python, reach later
      blocks, as do new and multiline values. Exports, os.environ changes and
      cd stay inside their script, workingDir picks where a block runs, and
      the interpreter prop runs an inline command with python3.
    steps:
      - block: set-initial-env
        expect: success
      - block: python-test
        expect: success
      - block: python-set-env
        expect: success
      - block: verify-python-env
        expect: success
      - block: python-inline
        expect: success
      - block: verify-env-vars
        expect: success
      - block: modify-env
        expect: success
      - block: verify-modified-env
        expect: success
      - block: set-multiline-env
        expect: success
      - block: verify-multiline-env
        expect: success
      - block: create-workdir
        expect: success
      - block: verify-cd-stays-in-script
        expect: success
      - block: verify-workdir
        expect: success

  - name: nothing-carries-between-tests
    description: |
      Each test case starts from a clean environment, so the variables from
      session-env-and-working-dir are gone.
    steps:
      - block: verify-env-vars
        expect: fail
