# Test configuration for the runbook-source-files feature demo

version: 1

settings:
  use_temp_working_dir: true
  timeout: 5m
  parallelizable: true

tests:
  - name: happy-path
    description: A script sources a helper from the runbook's folder while running in the session's directory

    assertions:
      - type: output_equals
        block: greet
        output: message
        value: hello from lib.sh
