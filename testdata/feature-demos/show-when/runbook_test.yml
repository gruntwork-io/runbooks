version: 1

settings:
  use_temp_working_dir: true
  timeout: 1m
  parallelizable: true

tests:
  - name: github
    description: |
      Before the provider is picked, both setup steps show. Once it is
      GitHub, the GitLab step hides.
    inputs:
      provider.Provider: github
    steps:
      - block: provider
        expect: success
      - block: gitlab-step
        expect: success
      - block: pick-provider
        expect: success
      - block: github-step
        expect: success
      - block: gitlab-step
        expect: hidden

  - name: gitlab
    description: |
      Without steps, every block runs in document order. The GitHub step is
      hidden, as the provider is GitLab, and is reported as hidden.
    inputs:
      provider.Provider: gitlab
