# This runbook's way to use the google-group module: a Terragrunt unit that includes the repository's root.hcl.
# The <TfModule> block renders it with the form's inputs and ModuleSource.
variables:
  - name: ModuleSource
    description: Where the code finds the module, such as git::https://github.com/fabricahq/infra-catalog.git//modules/google-group?ref=v0.14.0
  - name: id
    description: Email address of the group
  - name: display_name
    default: ""
  - name: description
    default: ""
  - name: domain
    default: ""
  - name: customer_id
    default: ""
  - name: owners
    type: list
    default: []
  - name: managers
    type: list
    default: []
  - name: members
    type: list
    default: []
  - name: types
    type: list
    default: [default]
