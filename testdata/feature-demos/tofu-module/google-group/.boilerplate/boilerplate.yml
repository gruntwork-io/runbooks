# The default way to consume this module: a terragrunt.hcl that includes the repository's root.hcl.
# Runbooks and `boilerplate` render it; a runbook can supply its own template instead.
variables:
  - name: SourceUrl
    description: The module's source, pinned with ?ref=, such as git::https://github.com/fabricahq/infra-catalog.git//modules/google-group?ref=v0.14.0
  - name: id
    description: Email address of the group
  - name: display_name
    default: ""
  - name: description
    default: ""
  - name: domain
    default: ""
  - name: customer_id
    default: ""
  - name: owners
    type: list
    default: []
  - name: managers
    type: list
    default: []
  - name: members
    type: list
    default: []
  - name: initial_group_config
    default: EMPTY
  - name: types
    type: list
    default: [default]
