version: 1

settings:
  use_temp_working_dir: true
  timeout: 1m

tests:
  - name: commands-run-in-sequence
    description: |
      cd-subdir's cd stays in its script, so verify-cwd runs in the test's
      working directory, and verify-cwd-in-subdir runs in subdir because of
      its workingDir prop. The UI test in web/e2e/test-sample-runbooks.spec.ts
      covers the clone block.
    steps:
      - block: cd-subdir
        expect: success
      - block: verify-cwd
        expect: success
      - block: verify-cwd-in-subdir
        expect: success
      - block: clone-after-cd
        expect: skip
    assertions:
      - type: output_matches
        block: verify-cwd
        output: cwd
        pattern: "(?<!/subdir)$"
      - type: output_matches
        block: verify-cwd-in-subdir
        output: cwd
        pattern: "/subdir$"
